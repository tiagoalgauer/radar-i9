# Configuração do Radar i9+ — a equipe edita este arquivo para o Parceiro.
nome = "Radar i9+"
intervalo_dias = 7                      # dias entre um Digest e o próximo (o Sandro escolhe)
link_painel = "https://radar-i9.streamlit.app"

[ia]
provedor = "gemini"                     # "gemini" | "groq"
modelo = "gemini-2.5-flash-lite"

[email]
alerta = ["sandro@inovemais.tec.br"]    # quem recebe o Alerta de marca
digest = ["sandro@inovemais.tec.br"]    # quem recebe o Digest

# Termos de marca (marca = true) disparam Alerta. Sem aspas no texto.
[[termos]]
texto = "InoveMais"
marca = true
idiomas = ["pt", "en"]

[[termos]]
texto = "i9+"
marca = true
idiomas = []                            # só detecção de marca (buscar "i9+" traz lixo)

